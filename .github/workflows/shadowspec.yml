name: ShadowSpec

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shadowspec:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start PostgreSQL
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U shadowspec -d shadowspec; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL did not become ready."
          docker compose logs postgres
          exit 1

      - name: Create replay database
        run: |
          docker compose exec -T postgres \
            psql -U shadowspec -d postgres \
            -c "CREATE DATABASE shadowspec_replay;"

      - name: Create production database schema
        run: |
          docker compose exec -T postgres \
            psql -U shadowspec -d shadowspec < db/schema.sql

      - name: Create replay database schema
        run: |
          docker compose exec -T postgres \
            psql -U shadowspec -d shadowspec_replay < db/schema.sql

      - name: Install dependencies
        run: npm install

      - name: Run ShadowSpec
        env:
          DB_NAME: shadowspec_replay
          SHADOWSPEC_TARGET_URL: http://127.0.0.1:3000
        run: |
          DB_NAME=shadowspec_replay npx tsx src/server.ts > target.log 2>&1 &

          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000/ > /dev/null; then
              echo "Target API is ready."
              break
            fi

            echo "Waiting for target API..."
            sleep 2
          done

          if ! curl -s http://127.0.0.1:3000/ > /dev/null; then
            echo "Target API did not become ready."
            cat target.log
            exit 1
          fi

          npx tsx src/run-replay.ts

      - name: Comment ShadowSpec result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            if (!fs.existsSync("shadowspec-report.json")) {
              return;
            }

            const report = JSON.parse(
              fs.readFileSync("shadowspec-report.json", "utf8")
            );

            const icon = report.passed ? "🟢" : "🔴";
            const title = report.passed
              ? "ShadowSpec passed"
              : "ShadowSpec detected behavioral regressions";

            let body = `${icon} **${title}**\n\n`;
            body += `- Scenarios: **${report.scenarios}**\n`;
            body += `- Passed: **${report.passedScenarios}**\n`;
            body += `- Failed: **${report.failedScenarios}**\n`;

            if (report.failures.length > 0) {
              body += "\n### Failures\n\n";

              for (const failure of report.failures) {
                body += `- **Scenario ${failure.scenario}** — \`${failure.method} ${failure.path}\`\n`;

                for (const difference of failure.differences) {
                  body += `  - **${difference.field}**\n`;
                  body += `    - Expected: \`${JSON.stringify(difference.expected)}\`\n`;
                  body += `    - Actual: \`${JSON.stringify(difference.actual)}\`\n`;
                }
              }
            }

            body += "\n---\n";
            body += "_ShadowSpec behavioral regression check_";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Upload ShadowSpec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadowspec-report
          path: |
            shadowspec-report.json
            target.log
          if-no-files-found: warn