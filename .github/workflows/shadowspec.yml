name: ShadowSpec

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shadowspec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start PostgreSQL
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U shadowspec -d shadowspec; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL did not become ready."
          docker compose logs postgres
          exit 1

      - name: Create replay database
        run: |
          docker compose exec -T postgres \
            psql -U shadowspec -d postgres \
            -c "CREATE DATABASE shadowspec_replay;"

      - name: Create production database schema
        run: |
          docker compose exec -T postgres \
            psql -U shadowspec -d shadowspec < db/schema.sql

      - name: Create replay database schema
        run: |
          docker compose exec -T postgres \
            psql -U shadowspec -d shadowspec_replay < db/schema.sql

      - name: Install dependencies
        run: npm install

      - name: Start replay server
        run: |
          DB_NAME=shadowspec_replay npx tsx src/replay-server.ts > replay.log 2>&1 &
          sleep 3

      - name: Run ShadowSpec
        env:
          DB_NAME: shadowspec_replay
        run: npx tsx src/run-replay.ts