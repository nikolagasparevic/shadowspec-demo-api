name: ShadowSpec

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shadowspec:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start PostgreSQL
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U shadowspec -d shadowspec; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL did not become ready."
          docker compose logs postgres
          exit 1

      - name: Create replay database
        run: |
          for i in {1..10}; do
            if docker compose exec -T postgres \
              psql -U shadowspec -d postgres \
              -c "SELECT 1;" > /dev/null 2>&1; then
              echo "PostgreSQL accepts SQL connections."
              break
            fi

            if [ "$i" -eq 10 ]; then
              echo "PostgreSQL did not become ready for SQL connections."
              docker compose logs postgres
              exit 1
            fi

            echo "PostgreSQL is not ready for queries yet..."
            sleep 2
          done

          docker compose exec -T postgres \
            psql -U shadowspec -d postgres \
            -c "CREATE DATABASE shadowspec_replay;"

      - name: Create production database schema
        run: |
          docker compose exec -T postgres \
            psql -U shadowspec -d shadowspec < db/schema.sql

      - name: Create replay database schema
        run: |
          docker compose exec -T postgres \
            psql -U shadowspec -d shadowspec_replay < db/schema.sql

      - name: Install dependencies
        run: npm install

      - name: Run ShadowSpec
        env:
          DB_NAME: shadowspec_replay
          SHADOWSPEC_TARGET_URL: http://127.0.0.1:3000
        run: |
          DB_NAME=shadowspec_replay npx tsx src/server.ts > target.log 2>&1 &

          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000/ > /dev/null; then
              echo "Target API is ready."
              break
            fi

            echo "Waiting for target API..."
            sleep 2
          done

          if ! curl -s http://127.0.0.1:3000/ > /dev/null; then
            echo "Target API did not become ready."
            cat target.log
            exit 1
          fi

          npx tsx src/run-replay.ts

      - name: Comment ShadowSpec result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            if (!fs.existsSync("shadowspec-report.json")) {
              return;
            }

            const report = JSON.parse(
              fs.readFileSync("shadowspec-report.json", "utf8")
            );

            function formatRequest(failure) {
              const queryParams = failure.queryParams || {};
              const queryString = new URLSearchParams(
                queryParams
              ).toString();

              return queryString
                ? `${failure.method} ${failure.path}?${queryString}`
                : `${failure.method} ${failure.path}`;
            }

            if (report.passed) {
              const body = [
                "🟢 **ShadowSpec passed**",
                "",
                `- Scenarios checked: **${report.scenarios}**`,
                `- No behavioral regressions detected.`,
                "",
                "---",
                "_ShadowSpec behavioral regression check_"
              ].join("\n");

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });

              return;
            }

            const regressionGroups = new Map();

            for (const failure of report.failures) {
              for (const difference of failure.differences) {
                const queryParams = failure.queryParams || {};

                const key = [
                  failure.method,
                  failure.path,
                  JSON.stringify(queryParams),
                  difference.field,
                  JSON.stringify(difference.expected),
                  JSON.stringify(difference.actual)
                ].join("|");

                const existing = regressionGroups.get(key);

                if (existing) {
                  existing.scenarios.push(failure.scenario);
                } else {
                  regressionGroups.set(key, {
                    method: failure.method,
                    path: failure.path,
                    queryParams,
                    field: difference.field,
                    expected: difference.expected,
                    actual: difference.actual,
                    scenarios: [failure.scenario]
                  });
                }
              }
            }

            const totalRegressions = report.failedScenarios;

            let body =
              `🔴 **${totalRegressions} behavioral regression${totalRegressions === 1 ? "" : "s"} detected**\n\n`;

            for (const regression of regressionGroups.values()) {
              const queryParams = regression.queryParams || {};

              const queryString = new URLSearchParams(
                queryParams
              ).toString();

              const requestPath = queryString
                ? `${regression.path}?${queryString}`
                : regression.path;

              body += `### \`${regression.method} ${requestPath}\`\n\n`;

              body += `**${regression.field} changed**\n\n`;

              body += `\`${JSON.stringify(regression.expected)}\` → \`${JSON.stringify(regression.actual)}\`\n\n`;

              if (regression.scenarios.length === 1) {
                body += `Scenario: **#${regression.scenarios[0]}**\n\n`;
              } else {
                body += `Scenarios: **${regression.scenarios.map((scenario) => `#${scenario}`).join(", ")}**\n\n`;
              }
            }

            body += "---\n";
            body += "_ShadowSpec behavioral regression check_";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Upload ShadowSpec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadowspec-report
          path: |
            shadowspec-report.json
            target.log
          if-no-files-found: warn